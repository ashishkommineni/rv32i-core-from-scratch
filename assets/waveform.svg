<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Representative RV32I load timing</title>
  <desc id="desc">A request stalls before handshake, the response arrives later, execute launches a data request, and retirement follows the data response.</desc>
  <style>.bg{fill:#071426}.grid{stroke:#1f3b55;stroke-width:1}.sig{fill:none;stroke:#38bdf8;stroke-width:4}.rsp{fill:none;stroke:#34d399;stroke-width:4}.ret{fill:none;stroke:#f472b6;stroke-width:4}.txt{fill:#d9efff;font:17px system-ui,sans-serif}.note{fill:#9fc5dc;font:15px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="txt" x="600" y="42" text-anchor="middle" font-size="27">Representative load: independent request and response phases</text>
  <g>
    <path class="grid" d="M220 70V500 M340 70V500 M460 70V500 M580 70V500 M700 70V500 M820 70V500 M940 70V500 M1060 70V500"/>
    <text class="note" x="220" y="525" text-anchor="middle">C0</text><text class="note" x="340" y="525" text-anchor="middle">C1</text><text class="note" x="460" y="525" text-anchor="middle">C2</text><text class="note" x="580" y="525" text-anchor="middle">C3</text><text class="note" x="700" y="525" text-anchor="middle">C4</text><text class="note" x="820" y="525" text-anchor="middle">C5</text><text class="note" x="940" y="525" text-anchor="middle">C6</text><text class="note" x="1060" y="525" text-anchor="middle">C7</text>
  </g>
  <text class="txt" x="30" y="105">imem_req_valid</text><path class="sig" d="M220 125V90H460V125H1060"/>
  <text class="txt" x="30" y="170">imem_req_ready</text><path class="rsp" d="M220 190H340V155H460V190H1060"/>
  <text class="txt" x="30" y="235">imem_rsp_valid</text><path class="rsp" d="M220 255H580V220H700V255H1060"/>
  <text class="txt" x="30" y="300">dmem_req_valid</text><path class="sig" d="M220 320H700V285H940V320H1060"/>
  <text class="txt" x="30" y="365">dmem_req_ready</text><path class="rsp" d="M220 385H820V350H940V385H1060"/>
  <text class="txt" x="30" y="430">dmem_rsp_valid</text><path class="rsp" d="M220 450H940V415H1060V450"/>
  <text class="txt" x="30" y="490">retire_valid</text><path class="ret" d="M220 500H1060V465H1125V500"/>
  <text class="note" x="400" y="82" text-anchor="middle">request held stable</text><text class="note" x="640" y="212" text-anchor="middle">instruction arrives</text><text class="note" x="880" y="277" text-anchor="middle">data request held</text><text class="note" x="1035" y="407" text-anchor="middle">load completes</text>
</svg>

